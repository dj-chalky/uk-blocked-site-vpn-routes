name: Update blocked-site VPN routes
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: osa-list-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python update.py
      - name: Maintain scheduled-workflow activity
        run: date -u +%Y-%m > .github/last-successful-update-month.txt
      - name: Publish changed data
        run: |
          if git diff --quiet -- domains.txt provenance.csv .github/last-successful-update-month.txt; then
            echo "Domain membership and monthly activity marker unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains.txt osa-domains.txt court-domains.txt live-sources-domains.txt glinet-*.txt provenance.csv metadata.json .github/last-successful-update-month.txt
          git commit -m "Refresh blocked-site VPN routing data"
          git push
