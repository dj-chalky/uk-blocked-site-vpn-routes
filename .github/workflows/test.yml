name: Test updater

on:
  pull_request:
    paths:
      - "*.py"
      - ".github/workflows/*.yml"
  push:
    branches:
      - main
    paths:
      - "*.py"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest -v
